name: Build Release Artifacts

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            python: "3.12"
            artifact: PyChem-macos.dmg
          - os: windows-latest
            python: "3.12"
            artifact: PyChem-windows.exe
          - os: ubuntu-latest
            python: "3.12"
            artifact: PyChem-linux

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install system deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y patchelf ccache libgl1 libegl1 libxkbcommon0 libdbus-1-3 libxcb-cursor0

      - name: Install system deps (macOS)
        if: runner.os == 'macOS'
        run: brew install ccache

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install nuitka pillow

      - name: Generate icons
        shell: bash
        run: |
          python - <<'PY'
          import os, sys, shutil, subprocess
          from PySide6.QtCore import Qt
          from PySide6.QtGui import QGuiApplication, QImage, QPainter
          from PySide6.QtSvg import QSvgRenderer
          from PIL import Image

          app = QGuiApplication([])
          r = QSvgRenderer("assets/icon.svg")
          def render(size, path):
              img = QImage(size, size, QImage.Format_ARGB32)
              img.fill(Qt.transparent)
              p = QPainter(img); p.setRenderHint(QPainter.Antialiasing); p.setRenderHint(QPainter.SmoothPixmapTransform)
              r.render(p); p.end(); img.save(path, "PNG")

          os.makedirs("build-tmp", exist_ok=True)
          if sys.platform == "darwin":
              os.makedirs("build-tmp/PyChem.iconset", exist_ok=True)
              for px, name in [(16,"16x16"),(32,"16x16@2x"),(32,"32x32"),(64,"32x32@2x"),
                               (128,"128x128"),(256,"128x128@2x"),(256,"256x256"),
                               (512,"256x256@2x"),(512,"512x512"),(1024,"512x512@2x")]:
                  render(px, f"build-tmp/PyChem.iconset/icon_{name}.png")
              subprocess.run(["iconutil","-c","icns","build-tmp/PyChem.iconset","-o","assets/icon.icns"], check=True)
          render(256, "build-tmp/icon_256.png")
          Image.open("build-tmp/icon_256.png").save("assets/icon.ico", format="ICO",
              sizes=[(16,16),(24,24),(32,32),(48,48),(64,64),(128,128),(256,256)])
          shutil.rmtree("build-tmp", ignore_errors=True)
          PY

      - name: Build with Nuitka
        run: python build.py

      - name: Package DMG (macOS)
        if: runner.os == 'macOS'
        run: |
          pip install dmgbuild
          python package_dmg.py
          mv dist/PyChem-*.dmg dist/${{ matrix.artifact }}

      - name: Rename artifact (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: mv dist/PyChem.exe dist/${{ matrix.artifact }}

      - name: Rename artifact (Linux)
        if: runner.os == 'Linux'
        run: mv dist/PyChem dist/${{ matrix.artifact }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
